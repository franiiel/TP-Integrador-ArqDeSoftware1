openapi: 3.1.0
info:
  title: API de Inspecciones de Obra
  version: 0.1.0
  summary: Caso de uso mínimo · un inspector completa un acta y queda asociada al expediente.
  description: |
    Contrato de la API del backend (NestJS). Diseño primero: el código debe respetar
    esta especificación; cualquier cambio de contrato se hace primero acá.

    **Autenticación:** todas las operaciones requieren un token de acceso emitido por
    Auth0 en el encabezado `Authorization: Bearer <token>`. El rol del usuario viaja
    en el token.

    **Alcance:** solo se documentan los endpoints del caso de uso mínimo.
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
security:
  - auth0: []
tags:
  - name: usuarios
    description: Datos del usuario autenticado
  - name: inspecciones
    description: Inspecciones asignadas
  - name: actas
    description: Envío y consulta de actas de inspección

paths:
  /me:
    get:
      tags: [usuarios]
      operationId: obtenerUsuarioActual
      summary: Datos del usuario autenticado
      description: Devuelve rol, cargo y legajo del usuario logueado.
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /inspecciones:
    get:
      tags: [inspecciones]
      operationId: listarInspeccionesAsignadas
      summary: Inspecciones asignadas al inspector
      description: Devuelve solo las inspecciones asignadas al inspector autenticado.
      responses:
        '200':
          description: Inspecciones asignadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inspeccion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'

  /actas:
    post:
      tags: [actas]
      operationId: recibirActa
      summary: Enviar un acta desde el celular
      description: |
        Recibe el acta completa y sus fotos en un único envío. El servidor la emite,
        le asigna el número correlativo anual y la deja en estado `PENDIENTE_ASOCIACION`
        mientras se asocia al expediente en el sistema municipal.

        **Idempotente:** el `id` del acta se genera en el celular. Si llega un acta con un
        `id` ya recibido (por ejemplo, por un reintento tras un corte de señal), el servidor
        no la duplica y responde `200` con los datos del acta ya emitida.

        Solo el inspector asignado a la inspección puede enviar su acta.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [acta, fotos]
              properties:
                acta:
                  $ref: '#/components/schemas/ActaNueva'
                fotos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: Fotos tomadas con la cámara dentro de la app.
                  items:
                    type: string
                    contentMediaType: image/jpeg
            encoding:
              acta:
                contentType: application/json
              fotos:
                contentType: image/jpeg, image/png
      responses:
        '201':
          description: Acta recibida y emitida por primera vez
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActaEmitida'
        '200':
          description: El acta ya había sido recibida (reintento); se devuelve la existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActaEmitida'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La inspección ya tiene otra acta emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /actas/{id}:
    get:
      tags: [actas]
      operationId: obtenerActa
      summary: Número y estado de un acta
      description: El inspector solo puede consultar sus propias actas.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Acta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActaEmitida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

components:
  securitySchemes:
    auth0:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por Auth0 (login con Google).

  responses:
    NoAutenticado:
      description: Falta el token o es inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El rol del usuario no permite la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DatosInvalidos:
      description: Los datos enviados no cumplen las validaciones
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          examples: [400]
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          examples: [Bad Request]

    Rol:
      type: string
      enum: [INSPECTOR, SUPERVISOR, ADMINISTRATIVO]
    EstadoActa:
      type: string
      description: Estado de la asociación del acta al expediente en el sistema municipal.
      enum: [PENDIENTE_ASOCIACION, ASOCIADA]
    TipoMedida:
      type: string
      enum: [NINGUNA, INTIMACION, CLAUSURA]

    Usuario:
      type: object
      required: [id, nombre, email, rol]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        cargo:
          type: [string, 'null']
          description: Solo inspector y supervisor
        legajo:
          type: [string, 'null']
          description: Solo inspector y supervisor

    Inspeccion:
      type: object
      required: [id, fecha, ubicacion, obra, expediente]
      properties:
        id:
          type: string
          format: uuid
        fecha:
          type: string
          format: date
        ubicacion:
          type: [string, 'null']
          description: Ubicación registrada al labrar el acta; `null` si todavía no se labró o no se pudo obtener
        obra:
          type: object
          required: [direccion, propietario, responsable]
          properties:
            direccion:
              type: string
            propietario:
              type: string
            responsable:
              type: string
        expediente:
          type: object
          required: [identificadorExterno]
          properties:
            identificadorExterno:
              type: integer
              description: Identificador del expediente en el sistema municipal
        actaId:
          type: [string, 'null']
          format: uuid
          description: Acta ya emitida para esta inspección, si existe

    NotificacionNueva:
      type: object
      required: [fechaEmision, destinatario, medio]
      properties:
        fechaEmision:
          type: string
          format: date
        destinatario:
          type: string
          minLength: 1
        medio:
          type: string
          minLength: 1
          examples: [En mano]

    ActaNueva:
      type: object
      description: Acta tal como la envía el celular.
      required:
        - id
        - inspeccionId
        - fechaEmision
        - observaciones
        - tipoMedida
        - notificacion
      properties:
        id:
          type: string
          format: uuid
          description: Generado en el celular; garantiza la idempotencia del envío
        inspeccionId:
          type: string
          format: uuid
        fechaEmision:
          type: string
          format: date-time
          description: Fecha legal del acta, tomada del celular al labrarla
        ubicacion:
          type: [string, 'null']
          description: Ubicación de la inspección tomada del celular; `null` si no se pudo obtener
          examples: ['-34.6037,-58.3816']
        observaciones:
          type: string
        tipoMedida:
          $ref: '#/components/schemas/TipoMedida'
        notificacion:
          $ref: '#/components/schemas/NotificacionNueva'

    ActaEmitida:
      type: object
      required: [id, numero, estado, fechaEmision, fechaHoraRecepcion]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          description: Correlativo por año, asignado por el servidor
          examples: [2026-00001]
        estado:
          $ref: '#/components/schemas/EstadoActa'
        fechaEmision:
          type: string
          format: date-time
        fechaHoraRecepcion:
          type: string
          format: date-time
