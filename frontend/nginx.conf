server {
  listen 80;
  root /usr/share/nginx/html;

  # The PWA and the API share the origin: no CORS needed.
  location /api/ {
    proxy_pass http://backend:3000;
    # An acta carries up to 10 photos of up to 10 MB each.
    client_max_body_size 110m;
  }

  # SPA: unknown paths are Angular routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
