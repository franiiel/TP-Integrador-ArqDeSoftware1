<header class="barra">
  <span class="barra-titulo">
    Inspecciones de obra
    @if (backendSimulado) {
      <span class="simulado" title="Datos de prueba: el backend está simulado en el frontend">Datos de prueba</span>
    }
  </span>
  <span class="conexion" [class.conexion-sin-senal]="!enLinea()" role="status">
    {{ enLinea() ? 'Con señal' : 'Sin señal' }}
  </span>
</header>

<main class="contenido">
  <router-outlet />
</main>

<nav class="navegacion" aria-label="Secciones">
  <a routerLink="/inspecciones" routerLinkActive="activo" ariaCurrentWhenActive="page">Mis inspecciones</a>
  <a routerLink="/pendientes" routerLinkActive="activo" ariaCurrentWhenActive="page">
    Pendientes
    @if (cantidadPendientes() > 0) {
      <span class="contador" [attr.aria-label]="cantidadPendientes() + ' sin enviar'">{{ cantidadPendientes() }}</span>
    }
  </a>
</nav>
